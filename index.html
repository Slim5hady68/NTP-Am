<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>NTP-Am</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="clock-panel" id="clock-panel" aria-live="off">
      <div class="clock-time" id="clock-time"></div>
      <div class="clock-date" id="clock-date"></div>
    </section>

    <div class="shortcuts" id="shortcuts"></div>
    <a class="settings-link" href="settings.html" aria-label="NTP-Am settings"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l-1.86 1.86A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 1.55V21H9v-1.05A1.7 1.7 0 0 0 8 18.4a1.7 1.7 0 0 0-1.88.34l-1.86-1.86A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.05 14H2v-4h1.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88L6.12 5.26A1.7 1.7 0 0 0 8 5.6 1.7 1.7 0 0 0 9 4.05V3h6v1.05A1.7 1.7 0 0 0 16 5.6a1.7 1.7 0 0 0 1.88-.34l1.86 1.86A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H22v4h-1.05A1.7 1.7 0 0 0 19.4 15Z"/></svg></a>
  </main>


  <div class="modal-overlay" id="modal" hidden>
    <section class="modal" role="dialog"
      aria-modal="true" aria-labelledby="modal-title">

      <div class="modal-header">
        <h2 id="modal-title">Add shortcut</h2>
        <button class="close-button" id="close-modal"
          aria-label="Close">×</button>
      </div>

      <form id="shortcut-form">
        <label for="site-name">Name</label>
        <input id="site-name" type="text"
          placeholder="Enter name" maxlength="30" required>

        <label for="site-url">Website URL</label>
        <input id="site-url" type="text"
          placeholder="Enter URL" inputmode="url" required>

        <p class="form-error" id="form-error"></p>

        <div class="modal-actions">
          <button type="button" class="remove-button"
            id="remove-shortcut" hidden>Remove</button>
          <button type="button" class="cancel-button"
            id="cancel-modal">Cancel</button>
          <button type="submit" class="save-button">Save</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
